name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.11 + ONNX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download ONNX Runtime Model Weights
        run: |
          python scripts/download_onnx_models.py

      - name: Run ONNX Parity Tests
        env:
          PYTHONPATH: .
          LLM_API_KEY: mock-ci-key-testing
          TESTING: "1"
        run: |
          python tests/test_onnx_parity.py

      - name: Run FastAPI Service Contract Tests
        env:
          PYTHONPATH: .
          LLM_API_KEY: mock-ci-key-testing
          TESTING: "1"
        run: |
          python -m unittest tests/test_api.py

      - name: Run Tier A Deterministic Regression Suite (23 Suites)
        env:
          PYTHONPATH: .
          LLM_API_KEY: mock-ci-key-testing
          TESTING: "1"
        run: |
          python tests/run_all_tests.py --tier-a

  frontend-test:
    name: Frontend Test Suite (Next.js 16 + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies for Integration Server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Unit & Integration Tests (161 Tests)
        working-directory: ./frontend
        env:
          PYTHON_PATH: python
          LLM_API_KEY: mock-ci-key-testing
          TESTING: "1"
        run: npx vitest run

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker-verification:
    name: Production Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-support-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: enterprise-support-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
